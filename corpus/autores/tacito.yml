nombre: "Tácito"
añoNacimiento: 55
añoFallecimiento: 120
semblanza: "Historiador romano de los Anales y las Historias. Escribió la Germania y la vida de su suegro Agrícola, donde pone en boca de un caudillo britano que Roma llama paz a lo que deja desierto. Las fechas son aproximadas."
tradicion: "otra"
