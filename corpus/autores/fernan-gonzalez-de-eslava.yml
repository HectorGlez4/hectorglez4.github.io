nombre: "Fernán González de Eslava"
añoNacimiento: 1534
añoFallecimiento: 1603
semblanza: "Clérigo, dramaturgo y poeta de origen español, emigrado joven a la Nueva España, donde escribió toda su obra. Sus Coloquios espirituales y sacramentales se imprimieron en México en 1610 y los editó Joaquín García Icazbalceta en 1877."
tradicion: "peninsular"
