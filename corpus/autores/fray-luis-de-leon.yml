nombre: "Fray Luis de León"
añoNacimiento: 1527
añoFallecimiento: 1591
semblanza: "Agustino, catedrático de Salamanca y poeta. Estuvo preso cuatro años por traducir el Cantar de los Cantares al castellano. Escribió en prosa sobre la vida retirada y el gobierno de uno mismo."
tradicion: "peninsular"
