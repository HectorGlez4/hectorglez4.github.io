# ── Séneca ───────────────────────────────────────────────────────────────────
- texto: "No es que tengamos poco tiempo, es que perdemos mucho."
  autor: Séneca
  temas: [El tiempo, La vida]
  procedencia: { obra: Sobre la brevedad de la vida, año: 49 }
  aptaParaPortada: true

- texto: "La vida, si sabes usarla, es larga."
  autor: Séneca
  temas: [El tiempo, La vida]
  procedencia: { obra: Sobre la brevedad de la vida, año: 49 }
  aptaParaPortada: true

- texto: "Mientras esperamos vivir, la vida pasa."
  autor: Séneca
  temas: [El tiempo, La vida]
  procedencia: { obra: Cartas a Lucilio, referencia: "Carta 1" }

- texto: "No hay viento favorable para el que no sabe adónde va."
  autor: Séneca
  temas: [La vida, El saber]
  procedencia: { obra: Cartas a Lucilio, referencia: "Carta 71" }
  aptaParaPortada: true

- texto: "Ninguna cosa se parece tanto a la injusticia como la justicia tardía."
  autor: Séneca
  temas: [La virtud]
  procedencia: { obra: Cartas a Lucilio }

# ── Miguel de Cervantes ──────────────────────────────────────────────────────
- texto: "La libertad, Sancho, es uno de los más preciosos dones que a los hombres dieron los cielos."
  autor: Miguel de Cervantes
  temas: [La libertad, La vida]
  procedencia: { obra: Don Quijote de la Mancha, año: 1615 }
  aptaParaPortada: true

- texto: "El que lee mucho y anda mucho, ve mucho y sabe mucho."
  autor: Miguel de Cervantes
  temas: [El saber, La vida]
  procedencia: { obra: Don Quijote de la Mancha, año: 1605 }

- texto: "Cada uno es hijo de sus obras."
  autor: Miguel de Cervantes
  temas: [La virtud, La vida]
  procedencia: { obra: Don Quijote de la Mancha, año: 1605 }
  aptaParaPortada: true

- texto: "La pluma es la lengua del alma."
  autor: Miguel de Cervantes
  temas: [La palabra]
  procedencia: { obra: Don Quijote de la Mancha, año: 1615 }

- texto: "Bien predica quien bien vive."
  autor: Miguel de Cervantes
  temas: [La virtud, La palabra]
  procedencia: { obra: Don Quijote de la Mancha, año: 1615 }

# ── Baltasar Gracián ─────────────────────────────────────────────────────────
- texto: "Lo bueno, si breve, dos veces bueno."
  autor: Baltasar Gracián
  temas: [La palabra]
  procedencia: { obra: Oráculo manual y arte de prudencia, año: 1647 }
  aptaParaPortada: true

- texto: "Saber y saberlo mostrar es saber dos veces."
  autor: Baltasar Gracián
  temas: [El saber]
  procedencia: { obra: Oráculo manual y arte de prudencia, año: 1647 }

- texto: "El sabio hace luego lo que el necio al fin."
  autor: Baltasar Gracián
  temas: [El saber, El tiempo]
  procedencia: { obra: Oráculo manual y arte de prudencia, año: 1647 }

# ── Sor Juana Inés de la Cruz ────────────────────────────────────────────────
- texto: "Yo no estudio para saber más, sino para ignorar menos."
  autor: Sor Juana Inés de la Cruz
  temas: [El saber]
  procedencia: { obra: Respuesta a sor Filotea de la Cruz, año: 1691 }
  aptaParaPortada: true

- texto: "Hombres necios que acusáis a la mujer sin razón, sin ver que sois la ocasión de lo mismo que culpáis."
  autor: Sor Juana Inés de la Cruz
  temas: [La palabra, La virtud]
  procedencia: { obra: Redondillas }

# ── Teresa de Jesús ──────────────────────────────────────────────────────────
- texto: "Nada te turbe, nada te espante, todo se pasa."
