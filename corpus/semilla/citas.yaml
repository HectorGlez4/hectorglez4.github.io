  temas: [La adversidad, La vida]
  procedencia: { obra: Poesías, referencia: "Conocido como «Nada te turbe»" }
  aptaParaPortada: true

- texto: "La paciencia todo lo alcanza."
  autor: Teresa de Jesús
  temas: [La adversidad, La virtud]
  procedencia: { obra: Poesías, referencia: "Conocido como «Nada te turbe»" }

# ── Francisco de Quevedo ─────────────────────────────────────────────────────
- texto: "Poderoso caballero es don Dinero."
