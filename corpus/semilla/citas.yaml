  temas: [La vida, El tiempo]
  procedencia: { obra: Campos de Castilla, año: 1912 }
  aptaParaPortada: true

- texto: "Despacito y buena letra: el hacer las cosas bien importa más que el hacerlas."
  autor: Antonio Machado
  temas: [La virtud, El tiempo]
  procedencia: { obra: Campos de Castilla, año: 1912 }
  aptaParaPortada: true

- texto: "Todo necio confunde valor y precio."
