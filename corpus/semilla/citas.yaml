# ── Rosalía de Castro ────────────────────────────────────────────────────────
- texto: "Yo no sé lo que busco eternamente en la tierra, en el aire y en el cielo."
  autor: Rosalía de Castro
  temas: [La vida, La adversidad]
  procedencia: { obra: En las orillas del Sar, año: 1884 }
  aptaParaPortada: true

# ── José Martí ───────────────────────────────────────────────────────────────
