  temas: [La amistad, La virtud]
  procedencia: { obra: Versos sencillos, año: 1891 }
  aptaParaPortada: true

- texto: "Con los pobres de la tierra quiero yo mi suerte echar."
  autor: José Martí
  temas: [La libertad, La vida]
  procedencia: { obra: Versos sencillos, año: 1891 }

