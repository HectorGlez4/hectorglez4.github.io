nombre: "Antonio de León y Gama"
añoNacimiento: 1735
añoFallecimiento: 1802
semblanza: "Astrónomo, antropólogo y escritor novohispano. Su Descripción histórica y cronológica de las dos piedras (1792) estudia la Piedra del Sol y la Coatlicue, halladas al reempedrar la plaza principal de México."
tradicion: "latinoamericana"
