# Pendientes de cotejo — Historia 11.2
#
# Las Citas de esta lista se publican sin que el build compruebe que su texto aparece en
# el documento de su Fuente, porque no tienen documento: son las 38 anteriores a la v3,
# dadas de alta cuando la Procedencia se tecleaba y todavía no existía `tools/recuperar.ts`.
#
# Es un CENSO CERRADO, y esa es toda su razón de ser:
#
#   · No admite altas. Una Cita nueva sin documento **rompe la construcción**; añadirla
#     aquí para desbloquear el build es exactamente el agujero que la Historia 11.2 cierra.
#   · Solo mengua. Un slug que ya no corresponde a ninguna Cita publicada rompe la
#     construcción, y una Cita que ya declara su Fuente y sigue aquí, también.
#   · Se cuenta a la vista: el build informa de cuántas quedan, `tools/auditoria.ts` lo
#     reporta junto a la salud del Corpus, y `tests/unit/andamiaje.test.ts` vigila que el
#     recuento no supere el tope registrado en `tools/lib/cotejo.ts`.
#
# Quien las saca de aquí es la Historia 11.4: recuperar el documento de cada obra, cotejar
# el texto contra su edición y borrar la línea. El día que esta lista quede vacía, el
# título de la historia será cierto sin excepciones.

