# Publicación de Sabiduría de Bolsillo.
#
# AD-12 — «El CI reconstruye una vez al día a hora fija, además de en cada push.»
#
# El disparador programado **no es infraestructura, es producto**: sin él la Cita del Día
# se congela hasta el siguiente commit y FR-9 deja de cumplirse, sin que nada falle ni
# avise. Es el fallo más silencioso de toda la arquitectura, y por eso vive aquí junto al
# resto y no en una tarea aparte que alguien pueda desactivar creyendo que es un detalle
# de despliegue.
#
# El destino es GitHub Pages porque es estático y gratuito, que es lo único que la espina
# exige. Cambiarlo es sustituir el trabajo `desplegar`; nada más del sitio lo sabe.

name: Publicar

on:
  # 1) Cada push a la rama principal.
  push:
    branches: [main]

  # 2) Una reconstrucción diaria a hora fija. 05:15 UTC: de madrugada en América y
  #    temprano en la península, así que la jornada cambia antes de que casi nadie mire.
  #    El minuto no es redondo a propósito — a las horas en punto GitHub encola muchísimo
  #    y el retraso puede pasar de una hora.
  schedule:
    - cron: '15 5 * * *'

  # 3) A mano, para poder forzar una jornada sin esperar ni publicar nada.
  workflow_dispatch:
    inputs:
      jornada:
        description: 'Jornada a componer (AAAA-MM-DD). Vacío = hoy.'
        required: false
        type: string

# Un solo despliegue a la vez, y el que llega después gana. No se cancela el que está en
# curso: un build a medias que se aborta puede dejar el despliegue sin terminar.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construir:
    name: Construir y validar el corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia 18.4 — el sitemap declara cuándo cambió cada superficie, y esa fecha
          # sale del historial del repositorio, que es donde vive el Corpus.
          #
          # Con la copia superficial de un solo commit que hace `checkout` por omisión, el
          # fallo **no** sería quedarse sin fechas: git trata el commit injertado como raíz,
          # así que `git log --name-only` lista el árbol entero y las 1.715 entradas
          # saldrían con la misma fecha, indistinguible de una fecha de build. Verde en la
          # máquina de quien lo escribe y mentira en producción.
          #
          # `integraciones/historial.ts` comprueba `--is-shallow-repository` antes de leer y en
          # ese caso no declara ninguna fecha, así que olvidar esta línea degrada el sitemap
          # en vez de falsearlo. Lo que la línea consigue es que no haga falta degradar.
          #
          # El coste está medido y no supuesto: 31 MB de `.git`, 348 commits, 16 MB
          # empaquetados — segundos. El trabajo `avisar` lo pide desde hace épicas.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # La validación no es un paso aparte: la puerta de admisión vive en el esquema
      # (AD-1), así que una Cita sin procedencia hace fallar este mismo `build`. Si falla,
      # el trabajo se detiene aquí, `desplegar` no llega a ejecutarse y **el sitio
      # anterior sigue servido** — que es exactamente lo que pide el criterio.
      - name: Construir
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          MEDICION_ENDPOINT: ${{ secrets.MEDICION_ENDPOINT }}
          # Sin valor, `jornadaDelBuild` usa la fecha de hoy. Es lo que hace que dos
          # builds del mismo día —el programado y cualquier push posterior— compongan
          # la misma Cita del Día.
          FECHA_JORNADA: ${{ inputs.jornada }}

      - name: Comprobar tipos
        run: npx astro check

      - name: Pruebas
        run: npm test

      # Historia 14.1 — el aviso de Umbral cruzado, y el único sitio de toda la épica donde
      # esto puede romper algo en vivo: **este flujo es el que despliega**. Un paso que
      # consulte al receptor y falle tumbaría la reconstrucción diaria del sitio publicado
      # por un problema del plano de medición que el sitio nunca lee — la dependencia exacta
      # que AD-14 existe para impedir. Que el aviso sea incapaz de fallar no es cortesía: es
      # el criterio, y por eso lleva tres cinturones y no uno:
      #
      #   · la orden sale con 0 pase lo que pase con el receptor (sin desplegar, caído o
      #     contestando cualquier cosa), y espera un tiempo acotado;
      #   · `continue-on-error`, por si la orden misma se rompiera —un `npm ci` a medias,
      #     un `tsx` que no arranca—;
      #   · `timeout-minutes`, por si algo se quedara colgado antes de subir el artefacto.
      #
      # Avisar no es contenido y no enciende nada: `--anotar` deja un `::warning::` en el
      # registro y el informe entero en el resumen del flujo, para que enterarse no dependa
      # de acordarse de ejecutar la orden.
      #
      # `if:` acota a los dos disparadores donde el secreto llega de verdad. Desde una
      # bifurcación, `secrets.MEDICION_ENDPOINT` llega **vacío**, y el informe diría
      # «falta LC-4» — indistinguible del estado legítimo de hoy, así que el aviso pasaría a
      # mentir en vez de faltar.
      #
      # `shell: bash` no es adorno: trae `-o pipefail`, sin el cual el código de salida de la
      # tubería sería el de `tee` y un `tsx` roto pasaría con el resumen vacío y el paso en
      # verde. Y el `|| echo` deja dicho en el resumen que esta reconstrucción fue sin aviso,
      # que es la diferencia entre «no había nada que avisar» y «no se pudo mirar».
      - name: Avisar si algún Umbral de Activación se cruzó
        if: github.event_name == 'schedule' || github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          MEDICION_ENDPOINT: ${{ secrets.MEDICION_ENDPOINT }}
        # El informe se envuelve en un bloque de código porque `$GITHUB_STEP_SUMMARY` se
        # renderiza como Markdown: crudo, la caja de ═ y el sangrado de dos espacios se
        # colapsan en un párrafo ilegible, justo donde se mira si un Umbral se cruzó.
        run: |
          {
            echo '```text'
            npm run --silent ingreso -- --anotar \
              || echo '(el mando de ingreso no pudo ejecutarse: esta reconstrucción va sin aviso de Umbrales)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    name: Desplegar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  # El aviso a los buscadores por IndexNow — Bing, Yandex, Naver y Seznam.
  #
  # Va en un trabajo aparte y con `needs: desplegar` por una razón que no es de orden sino
  # de verdad: IndexNow acude a la URL avisada casi al momento, y avisar antes de que el
  # despliegue termine la manda a la versión anterior. Sería peor que no avisar.
  #
  # Y va aquí y no en una integración de Astro porque AD-22 prohíbe que la construcción
  # pida nada por la red. `npm run build` sigue funcionando sin internet; esto no es parte
  # de construir el sitio, es parte de publicarlo.
  #
  # `continue-on-error` es deliberado: el sitio ya está en línea cuando esto corre, así que
  # un buscador caído no puede tumbar una publicación. El fallo se ve en rojo en el
  # trabajo, que es donde tiene que verse, y no arrastra al resto.
  avisar:
    name: Avisar a los buscadores
    needs: desplegar
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # El rango de commits del empujón se lee con `git diff`, y con la copia
          # superficial de un solo commit que hace `checkout` por omisión no existe.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Sin `--desde` en las reconstrucciones programadas: no hay empujón que comparar y lo
      # único que cambia es la Cita del Día, que la orden avisa siempre.
      - name: Avisar
        run: >
          npx tsx tools/avisar.ts
          ${{ github.event_name == 'push' && format('--desde {0} --hasta {1}', github.event.before, github.sha) || '' }}
